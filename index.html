<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josh 💕</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px; background: #121212; border-bottom: 1px solid #222; text-align: center; font-weight: bold; font-size: 18px; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background: #3797f0; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #262626; color: #fff; border-bottom-left-radius: 4px; }
    footer { padding: 12px; background: #121212; display: flex; gap: 8px; align-items: center; border-top: 1px solid #222; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none; }
    button, label { padding: 10px 14px; background: #3797f0; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>Josh 💕</header>
  <div id="chat"></div>
  <footer>
    <label for="img-input">📷</label>
    <input type="file" id="img-input" accept="image/*">
    <input type="text" id="msg-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
